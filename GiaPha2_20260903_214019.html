function norm(v){
  var s=String(v==null?"":v).toLowerCase().replace(/đ/g,"d");
  if(s.normalize){
    s=s.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  }
  return s;
}

function keyOf(node,path){
  if(node && node.Id!==null && node.Id!==undefined && node.Id!==""){
    return "id:"+node.Id;
  }
  return "path:"+path.join(".");
}

function empty(v){
  return v===null || v===undefined || v==="";
}

function internalField(k){
  return k==="children" || k.charAt(0)==="_";
}

function textValue(v){
  if(v==null)return "";
  if(typeof v==="object"){
    try{return JSON.stringify(v)}catch(e){return String(v)}
  }
  return String(v);
}

function fmtDate(v){
  if(empty(v))return "";

  var s=String(v).trim();

  // yyyy-MM-dd hoặc yyyy-MM-ddTHH:mm:ss
  if(
    s.length>=10 &&
    s.charAt(4)==="-" &&
    s.charAt(7)==="-"
  ){
    return (
      s.substring(8,10)+
      "/"+
      s.substring(5,7)+
      "/"+
      s.substring(0,4)
    );
  }

  // dd/MM/yyyy: giữ nguyên nếu dữ liệu đã đúng dạng Việt Nam.
  if(
    s.length>=10 &&
    s.charAt(2)==="/" &&
    s.charAt(5)==="/"
  ){
    return s.substring(0,10);
  }

  return s;
}

function fmtField(k,v){
  var nk=norm(k);
  if(nk.indexOf("ngay")>=0 || nk.indexOf("date")>=0){
    return fmtDate(v);
  }
  return textValue(v);
}

function nameOf(node){

  for(var i=0;i<a.length;i++){
    if(!empty(node[a[i]]))return String(node[a[i]]);
  }
  return "Thành viên"+(!empty(node.Id)?" "+node.Id:"");
}

function field(node,names){
  var keys=Object.keys(node||{});
  for(var i=0;i<names.length;i++){
    var n=norm(names[i]);
    for(var j=0;j<keys.length;j++){
      if(norm(keys[j])===n && !empty(node[keys[j]])){
        return node[keys[j]];
      }
    }
  }
  return "";
}

function birthOf(node){

function imageOf(node){
  var keys=Object.keys(node||{});
  for(var i=0;i<keys.length;i++){
    var k=norm(keys[i]);
    var v=node[keys[i]];
    if(empty(v))continue;

    var ks=
      k==="anh" ||
      k==="hinh" ||
      k==="hinhanh" ||
      k==="avatar" ||
      k==="photo" ||
      k==="image" ||
      k==="imageurl" ||
      k==="anhurl" ||
      k.indexOf("image")>=0 ||

    var s=String(v);
    var vs=
      s.indexOf("data:image/")===0 ||
      s.indexOf("https://")===0 ||
      s.indexOf("http://")===0;

    if(ks && vs)return s;
  }

}

    if(!empty(node[k]))p.push(textValue(node[k]));

  return norm(p.join(" "));
}

  if(!query)return true;
  if(selfMatch(node))return true;
  var c=node.children||[];
  for(var i=0;i<c.length;i++){
    if(subtreeMatch(c[i]))return true;
  }
  return false;
}

function walk(nodes,fn,path){
  path=path||[];
  (nodes||[]).forEach(function(node,i){
    var p=path.concat(i);
    fn(node,p);
    walk(node.children||[],fn,p);
  });
}

function totalCount(nodes){
  var n=0;
  walk(nodes,function(){n++});
  return n;
}

function openRoots(){
  (DATA||[]).forEach(function(node,i){
    open[keyOf(node,[i])]=true;
  });
}

function clear(el){
  while(el.firstChild)el.removeChild(el.firstChild);
}

function addText(parent,tag,cls,value){
  var el=document.createElement(tag);
  if(cls)el.className=cls;
  el.textContent=value;
  parent.appendChild(el);
  return el;
}

function showDetail(node,k){
  selectedKey=k;
  detailEmpty.style.display="none";
  detailContent.style.display="block";
  clear(detailContent);

  addText(detailContent,"div","person-name",nameOf(node));

  var image=imageOf(node);
  if(image){
    var img=document.createElement("img");
    img.className="person-image";
    img.alt=nameOf(node);
    img.src=image;
    detailContent.appendChild(img);
  }

  var fields=document.createElement("div");
  fields.className="fields";

  Object.keys(node||{}).forEach(function(f){
    if(internalField(f) || empty(node[f]))return;
    addText(fields,"div","field-label",labels[f]||f);
    addText(fields,"div","field-value",fmtField(f,node[f]));
  });

  detailContent.appendChild(fields);
  markSelected();
}

function markSelected(){
  var rows=document.querySelectorAll(".node-row");
  for(var i=0;i<rows.length;i++){
    if(rows[i].getAttribute("data-key")===selectedKey){
      rows[i].classList.add("active");
    }else{
      rows[i].classList.remove("active");
    }
  }
}

function meta(node,main){
  var b=birthOf(node);
  var h=homeOf(node);
  if(empty(b) && empty(h))return;

  var m=document.createElement("div");
  m.className="node-meta";

  if(!empty(b))addText(m,"span","","Sinh: "+fmtDate(b));
  if(!empty(h))addText(m,"span","","Quê: "+String(h));

  main.appendChild(m);
}

function renderNode(node,path,level,parent){
  if(query && !subtreeMatch(node))return 0;

  var k=keyOf(node,path);
  var children=node.children||[];
  var expanded=query ? true : !!open[k];

  var box=document.createElement("div");
  box.className="node";
  box.style.setProperty("--level",level);

  var row=document.createElement("div");
  row.className="node-row";
  row.setAttribute("data-key",k);

  var toggle=document.createElement("button");
  toggle.type="button";
  toggle.className="toggle";

  if(children.length){
    toggle.textContent=expanded?"▾":"▸";
    toggle.title=expanded?"Đóng nhánh":"Mở nhánh";
    toggle.onclick=function(e){
      e.stopPropagation();

      if(query){
        query="";
        search.value="";
      }

      open[k]=!open[k];
      render();
    };
  }else{
    toggle.textContent="•";
    toggle.disabled=true;
    toggle.style.cursor="default";
  }

  row.appendChild(toggle);

  var main=document.createElement("div");
  main.className="node-main";

  var name=document.createElement("div");
  name.className="node-name";

  if(!empty(node.STT)){
    addText(name,"span","stt",String(node.STT)+".");
  }

  addText(name,"span","",nameOf(node));
  main.appendChild(name);
  meta(node,main);

  row.appendChild(main);

  row.onclick=function(){
    showDetail(node,k);
  };

  box.appendChild(row);

  var visible=1;

  if(children.length && expanded){
    var childBox=document.createElement("div");

    children.forEach(function(child,i){
      visible+=renderNode(
        child,
        path.concat(i),
        level+1,
        childBox
      );
    });

    if(childBox.childNodes.length){
      box.appendChild(childBox);
    }
  }

  parent.appendChild(box);
  return visible;
}

function render(){
  clear(tree);

  var visible=0;

  (DATA||[]).forEach(function(node,i){
    visible+=renderNode(node,[i],0,tree);
  });

  var total=totalCount(DATA);

  if(!tree.childNodes.length){
    addText(tree,"div","no-result","Không tìm thấy người phù hợp.");
  }

  count.textContent=
    query
      ? "Đang hiển thị "+visible+" / "+total+" người"
      : "Tổng cộng "+total+" người";

  markSelected();
}

search.oninput=function(){
  query=norm(search.value.trim());
  render();
};

document.getElementById("btnClear").onclick=function(){
  search.value="";
  query="";
  search.focus();
  render();
};

document.getElementById("btnOpenAll").onclick=function(){
  search.value="";
  query="";

  walk(DATA,function(node,path){
    if(node.children && node.children.length){
      open[keyOf(node,path)]=true;
    }
  });

  render();
};

document.getElementById("btnCloseAll").onclick=function(){
  search.value="";
  query="";
  open={};
  render();
};

openRoots();
render();

if(DATA && DATA.length){
  showDetail(DATA[0],keyOf(DATA[0],[0]));
}

})();
</script></body></html>
